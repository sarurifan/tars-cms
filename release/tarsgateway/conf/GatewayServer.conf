<main>
    #传到后面taf服务的http头, 多个头以,分隔
    filterheaders = X-GUID|X-XUA|Host
    # 是否打开通过主控发现代理，1打开， 0 关闭
    auto_proxy=1
    flow_report_obj=Base.GatewayServer.FlowControlObj
    <base>
        # tup 回包大小限制
        rspsize=5242880
        tup_host=
        tup_path=/tup
        json_path=/json
        monitor_url=/monitor/monitor.html
    </base>
    <http_retcode>
        inactive=2|6
        timeout=1|3
    </http_retcode>

    <http_router>
        # 默认路由规则
    </http_router>

    <proxy>
        # servant 映射
    </proxy>

    <db>
        charset=utf8
        dbhost =172.25.0.2
        dbname =db_base
        dbpass =tars@root.2026
        dbport =3306
        dbuser =root
    </db>
</main>